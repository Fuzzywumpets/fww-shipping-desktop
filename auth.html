<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FWW Shipping</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #1a1a1a;
    color: #f0f0f0;
    font: 14px/1.5 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .card {
    text-align: center;
    max-width: 340px;
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    margin: 0 auto 18px;
    display: block;
  }
  h1 {
    font-size: 22pt;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #9BBC0E;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #6b7280;
    margin-bottom: 32px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2e2e2e;
    border-top-color: #9BBC0E;
    border-radius: 50%;
    animation: spin .75s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="assets/icon.png" alt="FWW">
  <h1>Fuzzywumpets</h1>
  <div class="sub">Shipping Console</div>
  <div class="spinner"></div>
  <div class="msg">Loading…</div>
</div>
</body>
</html>
