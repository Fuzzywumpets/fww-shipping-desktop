name: Build & Release

on:
  push:
    tags:
      # SYNC: the pushed tag MUST be exactly v<package.json "version"> — electron-builder
      # derives the release version, the installer name (FWW-Shipping-Setup-${version}.exe),
      # and latest.yml's contents from package.json, NOT from the tag. Pushing v1.0.19
      # while package.json still says 1.0.18 publishes a latest.yml that advertises
      # 1.0.18, so every installed client's auto-update silently stops seeing new
      # versions (same trap that broke fww-b2b-admin). Bump package.json "version"
      # FIRST, commit, then tag that commit with the matching v<version>.
      - 'v*'
  workflow_dispatch:

# electron-builder creates the GitHub Release, so the workflow token must be able
# to write release contents. (A read-only token here used to make publish 403.)
permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SINGLE publisher. electron-builder uploads the installer, its .blockmap,
      # and latest.yml with matching file names + SHA512 hashes — which is exactly
      # what electron-updater reads to verify and apply an update. The previous
      # workflow ALSO ran softprops/action-gh-release, which uploaded a SECOND copy
      # of the .exe under a different (dotted) name and re-uploaded the yml files —
      # two publishers, a duplicate installer, and a real risk of latest.yml no
      # longer matching the downloadable file. releaseType is set to "release" in
      # package.json so this publishes a NON-draft release that electron-updater
      # can actually see.
      - name: Build & publish NSIS installer
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI artifact only — for debugging a build. This does NOT touch the Release.
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
